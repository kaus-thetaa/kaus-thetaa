
name: README Arcade

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Generate Arcade artwork
        uses: ECD5A/README-Arcade@v1
        with:
          user: kaus-thetaa
          mode: matrix
          speed: normal

      - name: Add display name
        run: python scripts/add_arcade_name.py

      - name: Publish branded artwork
        run: |
          cp dist/readme-arcade.svg dist/readme-arcade-kaus-theta.svg
          cp dist/readme-arcade-dark.svg dist/readme-arcade-kaus-theta-dark.svg

      - name: Verify generated artwork
        run: |
          test -s dist/readme-arcade.svg
          test -s dist/readme-arcade-dark.svg
          test -s dist/readme-arcade-kaus-theta.svg
          test -s dist/readme-arcade-kaus-theta-dark.svg

      - name: Commit artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet || git commit -m "Update README Arcade"
          git push
